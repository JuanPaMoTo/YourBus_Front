# .pipeline/azure-pipelines.yml — YourBus_Front
#
# Flujo DevOps (cada caja del pipeline tiene un solo propósito):
#   1. Compile / Build -> 2. Quality Gates (lint, pruebas, SonarCloud) -> 3. Package
#   -> 4. Deploy DEV -> 5. Deploy QA -> 6. Seguridad (ZAP) y 7. Rendimiento (Lighthouse)
#   (en paralelo, sobre QA) -> 8. Deploy PROD (con aprobación manual).
# Se promueve el mismo artefacto por DEV -> QA -> PROD; PROD espera a los análisis.
#
# Requisitos previos en Azure DevOps (se configuran una vez, en el portal):
#   - 3 "Environments" creados: yourbus-front-dev, yourbus-front-qa, yourbus-front-prod
#   - En yourbus-front-prod (y opcionalmente QA): agregar un "Approval check"
#     (aprobación manual) para que nadie despliegue a PROD sin revisión humana.
#   - Service connection de Azure llamada "AzureServiceConnection".
#   - 3 App Services (Publicar: Código, Node 22 LTS, Linux):
#     yourbus-front-dev / yourbus-front-qa / yourbus-front-prod
#
# El front es un sitio estático (carpeta dist de Vite). En App Service Linux se
# sirve con deploy/server.cjs: fallback de SPA para React Router + cabeceras de seguridad.
# La URL del backend la elige src/services/api.js según el dominio del front.
#
# Inspección de código con SonarCloud: ACTIVADA (runSonar = 'true').
# cuando ya exista la organización, el proyecto y la service connection
# 'SonarCloud' (pasos en el README, sección "SonarCloud").

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '*.md'

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '22.x'
  runSonar: 'true'
  sonarOrganization: 'juanpamoto'
  sonarProjectKey: 'JuanPaMoTo_YourBus_Front'

stages:

  # ---------------------------------------------------------------------
  # 1) COMPILE / BUILD — instala dependencias y compila el sitio
  # ---------------------------------------------------------------------
  - stage: Build
    displayName: '1. Compile / Build'
    jobs:
      - job: Compile
        displayName: 'Instalar y compilar'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Usar Node.js $(nodeVersion)'

          # HUSKY=0: los hooks de git son para el computador del desarrollador, no para CI.
          - script: npm ci
            displayName: 'npm ci'
            env:
              HUSKY: '0'

          - script: npm run build
            displayName: 'Compilar (vite build)'

          # Servidor propio (sin dependencias) que sirve dist/ con cabeceras de seguridad.
          - script: cp deploy/server.cjs dist/server.cjs
            displayName: 'Incluir servidor estático con cabeceras de seguridad'

          - publish: '$(System.DefaultWorkingDirectory)/dist'
            artifact: 'frontend-dist'
            displayName: 'Publicar artefacto compilado'

  # ---------------------------------------------------------------------
  # 2) QUALITY GATES — lint, pruebas con cobertura y SonarCloud.
  #    Si algo falla aquí, no se empaqueta ni se despliega nada.
  # ---------------------------------------------------------------------
  - stage: QualityGates
    displayName: '2. Quality Gates'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: LintPruebasSonar
        displayName: 'Lint, pruebas y SonarCloud'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # Historial completo: SonarCloud lo necesita para atribuir líneas nuevas.
          - checkout: self
            fetchDepth: 0

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Usar Node.js $(nodeVersion)'

          - task: SonarCloudPrepare@4
            condition: eq(variables['runSonar'], 'true')
            displayName: 'SonarCloud: preparar análisis'
            inputs:
              SonarCloud: 'SonarCloud'
              organization: '$(sonarOrganization)'
              scannerMode: 'cli'
              configMode: 'manual'
              cliProjectKey: '$(sonarProjectKey)'
              cliProjectName: 'YourBus_Front'
              cliSources: 'src'
              extraProperties: |
                sonar.tests=src
                sonar.test.inclusions=**/__tests__/**
                sonar.exclusions=**/__tests__/**,**/node_modules/**,coverage/**,dist/**
                sonar.javascript.lcov.reportPaths=coverage/lcov.info

          # HUSKY=0: los hooks de git son para el computador del desarrollador, no para CI.
          - script: npm ci
            displayName: 'npm ci'
            env:
              HUSKY: '0'

          # --- Quality Gate: análisis estático de código ---
          - script: npm run lint
            displayName: 'Quality Gate: lint (oxlint)'

          # --- Quality Gate: pruebas unitarias/de componentes ---
          # Dos reporteros: "default" imprime en consola qué prueba falla y
          # "junit" escribe el archivo que se publica en Azure DevOps.
          - script: npm test -- --coverage --reporter=default --reporter=junit --outputFile.junit=test-results.xml
            displayName: 'Quality Gate: pruebas unitarias + cobertura (vitest)'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results.xml'
              testRunTitle: 'YourBus_Front - Unit Tests'

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'

          # --- Quality Gate: inspección de código en SonarCloud ---
          - task: SonarCloudAnalyze@4
            condition: and(succeeded(), eq(variables['runSonar'], 'true'))
            displayName: 'SonarCloud: analizar código'

          - task: SonarCloudPublish@4
            condition: and(succeeded(), eq(variables['runSonar'], 'true'))
            displayName: 'SonarCloud: publicar resultado'
            inputs:
              pollingTimeoutSec: '300'

  # ---------------------------------------------------------------------
  # 3) PACKAGE — empaqueta el sitio estático listo para desplegar
  # ---------------------------------------------------------------------
  - stage: Package
    displayName: '3. Package'
    dependsOn: QualityGates
    condition: succeeded()
    jobs:
      - job: PackageArtifact
        displayName: 'Empaquetar build estático'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - download: current
            artifact: 'frontend-dist'

          - task: ArchiveFiles@2
            displayName: 'Comprimir dist/ en zip versionado'
            inputs:
              rootFolderOrFile: '$(Pipeline.Workspace)/frontend-dist'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/yourbus-front-$(Build.BuildId).zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/yourbus-front-$(Build.BuildId).zip'
            artifact: 'frontend-package'
            displayName: 'Publicar paquete final'

  # ---------------------------------------------------------------------
  # DEPLOY — el mismo artefacto se promueve DEV (4) -> QA (5) -> PROD (8)
  # ---------------------------------------------------------------------
  - stage: Deploy_DEV
    displayName: '4. Deploy - DEV'
    dependsOn: Package
    condition: succeeded()
    jobs:
      - deployment: DeployDev
        displayName: 'Desplegar a DEV'
        environment: 'yourbus-front-dev'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Desplegar en Azure App Service (DEV)'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appType: 'webAppLinux'
                    appName: 'yourbus-front-dev'
                    package: '$(Pipeline.Workspace)/frontend-package/*.zip'
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'node /home/site/wwwroot/server.cjs'

                - script: |
                    URL="https://yourbus-front-dev-cvesf3apbsa9gpcg.chilecentral-01.azurewebsites.net"
                    echo "Esperando 30 segundos iniciales a que el sitio inicie en DEV..."
                    sleep 30
                    SUCCESS=0
                    for i in $(seq 1 18); do
                      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
                      if [ "$HTTP_STATUS" -eq 200 ]; then
                        echo "Front DEV respondiendo HTTP 200 OK."
                        SUCCESS=1
                        break
                      fi
                      echo "Intento $i: Código HTTP recibido $HTTP_STATUS, reintentando en 10s..."
                      sleep 10
                    done
                    if [ $SUCCESS -ne 1 ]; then
                      echo "Error: el front en DEV no respondió HTTP 200 dentro del tiempo esperado."
                      exit 1
                    fi
                  displayName: 'Verificación post-despliegue en DEV'

  - stage: Deploy_QA
    displayName: '5. Deploy - QA'
    dependsOn: Deploy_DEV
    condition: succeeded()
    jobs:
      - deployment: DeployQA
        displayName: 'Desplegar a QA y validar'
        environment: 'yourbus-front-qa'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Desplegar en Azure App Service (QA)'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appType: 'webAppLinux'
                    appName: 'yourbus-front-qa'
                    package: '$(Pipeline.Workspace)/frontend-package/*.zip'
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'node /home/site/wwwroot/server.cjs'

                # --- Quality Gate de QA: pruebas contra el sitio ya desplegado ---
                - script: |
                    URL="https://yourbus-front-qa-b4cue0d0a9c0ghc0.chilecentral-01.azurewebsites.net"
                    echo "Esperando 30 segundos iniciales a que el sitio inicie en QA..."
                    sleep 30
                    SUCCESS=0
                    for i in $(seq 1 18); do
                      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
                      if [ "$HTTP_STATUS" -eq 200 ]; then
                        echo "Front QA respondiendo HTTP 200 OK."
                        SUCCESS=1
                        break
                      fi
                      echo "Intento $i: Código HTTP recibido $HTTP_STATUS, reintentando en 10s..."
                      sleep 10
                    done
                    if [ $SUCCESS -ne 1 ]; then
                      echo "Error: el front en QA no respondió HTTP 200 dentro del tiempo esperado."
                      exit 1
                    fi
                  displayName: 'Quality Gate QA: smoke test (sitio responde)'

                # Punto de extensión: aquí se agregarían pruebas E2E
                # (Cypress/Playwright) contra el entorno QA antes de aprobar PROD.

  # ---------------------------------------------------------------------
  # 6) SEGURIDAD — solo análisis de seguridad (OWASP ZAP, pasivo) sobre QA.
  #    Los informes quedan como artefactos descargables de la ejecución.
  # ---------------------------------------------------------------------
  - stage: Security_QA
    displayName: '6. Seguridad (ZAP) - QA'
    dependsOn: Deploy_QA
    condition: succeeded()
    jobs:
      - job: ZAP_Front
        displayName: 'OWASP ZAP sobre el front de QA'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # Escaneo "baseline" de OWASP ZAP: pasivo (no ataca ni modifica datos),
          # revisa cabeceras, cookies y configuración según el OWASP Top 10.
          - script: |
              OUT="$(Build.ArtifactStagingDirectory)/zap"
              mkdir -p "$OUT" && chmod 777 "$OUT"
              docker run --rm -v "$OUT":/zap/wrk:rw -t ghcr.io/zaproxy/zaproxy:stable \
                zap-baseline.py -t "https://yourbus-front-qa-b4cue0d0a9c0ghc0.chilecentral-01.azurewebsites.net" -r reporte-zap.html -J reporte-zap.json -I
            displayName: 'OWASP ZAP: escaneo baseline'
            continueOnError: true

          - publish: '$(Build.ArtifactStagingDirectory)/zap'
            artifact: 'reporte-zap-front'
            displayName: 'Publicar informe de ZAP'
            condition: succeededOrFailed()

  # ---------------------------------------------------------------------
  # 7) RENDIMIENTO WEB — Lighthouse (rendimiento, accesibilidad, SEO) sobre QA.
  #    No es seguridad, por eso va en su propia etapa, en paralelo a la 6.
  # ---------------------------------------------------------------------
  - stage: Performance_QA
    displayName: '7. Rendimiento (Lighthouse) - QA'
    dependsOn: Deploy_QA
    condition: succeeded()
    jobs:
      - job: Lighthouse
        displayName: 'Lighthouse sobre el front de QA'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: 'Usar Node.js 22'

          # Auditoría de Google: rendimiento, accesibilidad, buenas prácticas y SEO.
          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/lighthouse"
              export CHROME_PATH="$(which google-chrome)"
              npx --yes lighthouse@12.6.0 "https://yourbus-front-qa-b4cue0d0a9c0ghc0.chilecentral-01.azurewebsites.net" \
                --chrome-flags="--headless=new --no-sandbox" \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=html --output=json \
                --output-path="$(Build.ArtifactStagingDirectory)/lighthouse/reporte-lighthouse" \
                --quiet
            displayName: 'Lighthouse: auditar la página'
            continueOnError: true

          - script: |
              node -e "
              const r = require('$(Build.ArtifactStagingDirectory)/lighthouse/reporte-lighthouse.report.json');
              for (const [k, v] of Object.entries(r.categories)) console.log(v.title + ': ' + Math.round(v.score * 100) + '/100');
              "
            displayName: 'Lighthouse: mostrar notas'
            continueOnError: true

          - publish: '$(Build.ArtifactStagingDirectory)/lighthouse'
            artifact: 'reporte-lighthouse'
            displayName: 'Publicar informe de Lighthouse'
            condition: succeededOrFailed()

  # ---------------------------------------------------------------------
  # 8) DEPLOY PROD — solo si QA y los análisis de seguridad y rendimiento terminaron bien.
  # ---------------------------------------------------------------------
  - stage: Deploy_PROD
    displayName: '8. Deploy - PROD'
    dependsOn:
      - Security_QA
      - Performance_QA
    condition: succeeded()
    jobs:
      # Este job solo arranca si el "Approval check" configurado en el
      # environment 'yourbus-front-prod' es aprobado manualmente en Azure DevOps.
      - deployment: DeployProd
        displayName: 'Desplegar a PROD'
        environment: 'yourbus-front-prod'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Desplegar en Azure App Service (PROD)'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appType: 'webAppLinux'
                    appName: 'yourbus-front-prod'
                    package: '$(Pipeline.Workspace)/frontend-package/*.zip'
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'node /home/site/wwwroot/server.cjs'

                - script: |
                    URL="https://yourbus-front-prod-ckeqapbpexdpfkbb.chilecentral-01.azurewebsites.net"
                    echo "Esperando 30 segundos iniciales a que el sitio inicie en PROD..."
                    sleep 30
                    SUCCESS=0
                    for i in $(seq 1 18); do
                      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
                      if [ "$HTTP_STATUS" -eq 200 ]; then
                        echo "Front PROD respondiendo HTTP 200 OK."
                        SUCCESS=1
                        break
                      fi
                      echo "Intento $i: Código HTTP recibido $HTTP_STATUS, reintentando en 10s..."
                      sleep 10
                    done
                    if [ $SUCCESS -ne 1 ]; then
                      echo "Error: el front en PROD no respondió HTTP 200 dentro del tiempo esperado."
                      exit 1
                    fi
                  displayName: 'Verificación post-despliegue en PROD'